<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скачивание rmyatolauncher...</title>
    <link rel="icon" href="https://uploads.onecompiler.io/43bwbqbxa/44v59a2k5/rmyatolauncher.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #0f0c1b;
            --accent-color: #8a2be2;
            --text-color: #ffffff;
            --text-muted: #a0a5c0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .download-container {
            max-width: 500px;
            padding: 40px;
            background: #16122c;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--accent-color));
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--accent-color)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--accent-color)); }
        }

        h2 { margin-bottom: 10px; font-size: 1.8rem; }
        p { color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }

        .counter-box {
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            color: #fff;
        }

        .counter-number {
            font-weight: bold;
            color: var(--accent-hover);
        }

        .manual-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        .manual-link:hover { text-decoration: underline; }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="download-container">
        <img class="logo" src="https://uploads.onecompiler.io/43bwbqbxa/44v59a2k5/rmyatolauncher.ico" alt="logo">
        <h2>Спасибо за скачивание!</h2>
        
        <!-- Блок счетчика -->
        <div class="counter-box">
            Всего скачиваний: <span id="download-count" class="counter-number">Загрузка...</span>
        </div>

        <p>Загрузка лаунчера <strong>rmyatolauncher</strong> начнется автоматически.<br><br>
        Если скачивание не началось, <a href="ссылка_на_твой_лаунчер.exe" class="manual-link">нажмите сюда</a>.</p>
        
        <a href="index.html" class="back-btn">← Вернуться на главную</a>
    </div>

    <script>
        // Код счетчика скачиваний
        async function updateDownloadCounter() {
            try {
                // Запрос к бесплатному API счетчика
                const response = await fetch('https://api.countapi.xyz/hit/rmyatolauncher-site/downloads');
                const data = await response.json();
                document.getElementById('download-count').innerText = data.value;
            } catch (error) {
                document.getElementById('download-count').innerText = '1+';
            }
        }

        window.onload = function() {
            updateDownloadCounter();

            const downloadUrl = 'ссылка_на_твой_лаунчер.exe'; 
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'rmyatolauncher.exe';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, 1500);
        };
    </script>

</body>
</html>
