<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rmyatolauncher — Лучший лаунчер Minecraft</title>
    <link rel="icon" href="https://uploads.onecompiler.io/43bwbqbxa/44v59a2k5/rmyatolauncher.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #16122c;
            --accent-color: #8a2be2;
            --accent-hover: #a04ef6;
            --text-color: #ffffff;
            --text-muted: #a0a5c0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .glow-bg {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }

        header {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
            text-decoration: none;
        }

        .logo img {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px var(--accent-color));
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #fff;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #fff, #b983ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.6;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--accent-color);
            color: #fff;
            padding: 18px 45px;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            margin-bottom: 50px;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.7);
        }

        .screenshots-section {
            width: 100%;
            margin-top: 20px;
        }

        .screenshots-section h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }

        .screenshots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .screenshot-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            position: relative;
            padding-top: 75%; /* Соответствует пропорции 640x480 */
            height: 0;
        }

        .screenshot-card iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .screenshot-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 20px rgba(138, 43, 226, 0.2);
        }

        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>

    <header>
        <a href="index.html" class="logo">
            <img src="https://uploads.onecompiler.io/43bwbqbxa/44v59a2k5/rmyatolauncher.ico" alt="logo">
            rmyatolauncher
        </a>
        <nav>
            <a href="index.html" class="active">Главная</a>
            <a href="creators.html">Создатели</a>
        </nav>
    </header>

    <main class="main-content">
        <h1>Твой новый мир Minecraft</h1>
        <p class="subtitle">Открой для себя rmyatolauncher — быстрый, легкий и максимально удобный лаунчер для комфортного запуска любимой игры без лишнего мусора.</p>
        
        <a href="download.html" class="download-btn">
            Скачать лаунчер
        </a>

        <section class="screenshots-section">
            <h2>Интерфейс лаунчера</h2>
            <div class="screenshots-container">
                <div class="screenshot-card">
                    <iframe src="https://drive.google.com/file/d/1cMb3BpGIiu526fovNfFbtY7Y8VLz_hy_/preview" allow="autoplay"></iframe>
                </div>
                <div class="screenshot-card">
                    <iframe src="https://drive.google.com/file/d/1Rd0wQtQfQUUxjBSdxg4spgk5rLobE32E/preview" allow="autoplay"></iframe>
                </div>
                <div class="screenshot-card">
                    <iframe src="https://drive.google.com/file/d/1wtS5NYIbzWoOf3V65QmsBW7AYv_hWKLD/preview" allow="autoplay"></iframe>
                </div>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 rmyatolauncher. Все права защищены.
    </footer>
</body>
</html>
